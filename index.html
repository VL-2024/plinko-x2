<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="format-detection" content="telephone=no" />
  <title>PLINKO — X2 LOTO</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app" id="app">
    <header class="topbar">
      <div class="brand">
        <div class="x2">X2</div>
        <div>
          <div class="title">PLINKO</div>
          <div class="subtitle">X2 LOTO</div>
        </div>
      </div>
      <div class="balance-card">
        <span id="balanceLabel">Баланс</span>
        <strong id="balance">—</strong>
      </div>
    </header>

    <section class="board-card">
      <canvas id="board" width="720" height="920" aria-label="Plinko board"></canvas>
      <div class="result" id="result" aria-live="polite"></div>
    </section>

    <section class="controls">
      <div class="action-row">
        <button id="newGameBtn" class="action-btn primary" type="button">НОВАЯ ИГРА</button>
        <div class="auto-wrap">
          <button id="autoBtn" class="action-btn secondary" type="button">АВТОИГРА</button>
          <div id="autoMenu" class="auto-menu" hidden></div>
        </div>
      </div>

      <div class="denom-wrap">
        <div class="denom-label" id="stakeLabel">Номинал</div>
        <div class="denoms" id="denoms"></div>
      </div>

      <div class="lowerbar">
        <div class="toolbar">
          <div class="mode-toggle" aria-label="Режим игры">
            <button id="realBtn" type="button">REAL</button>
            <button id="demoBtn" type="button">DEMO</button>
          </div>
          <button id="infoBtn" class="tool-btn" type="button">ⓘ <span>Инфо</span></button>
          <button id="soundBtn" class="tool-btn" type="button" aria-pressed="true">🔊 <span>Звук</span></button>
          <button id="musicBtn" class="tool-btn" type="button" aria-pressed="false">♫ <span>Музыка</span></button>
        </div>
        <div class="ticket" id="ticketId">Билет: —</div>
      </div>

      <div class="status" id="status"></div>
    </section>
  </main>

  <div id="infoModal" class="modal-backdrop" hidden>
    <section class="info-panel" role="dialog" aria-modal="true" aria-labelledby="infoTitle">
      <div class="info-head">
        <strong id="infoTitle">Инфо</strong>
        <button id="infoClose" class="close-btn" type="button" aria-label="Закрыть">×</button>
      </div>
      <div class="info-tabs" id="infoTabs">
        <button type="button" data-tab="payouts" class="active">Таблица выплат</button>
        <button type="button" data-tab="how">Как играть</button>
        <button type="button" data-tab="tickets">Мои билеты</button>
      </div>
      <div id="infoContent" class="info-content"></div>
    </section>
  </div>

  <script src="config.js"></script>
  <script src="lms-adapter.js"></script>
  <script src="src/game.js"></script>
</body>
</html>
